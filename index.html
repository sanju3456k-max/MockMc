    <script>
      // Prevent benign sandbox Vite HMR/WebSocket errors and database closing/hidden errors from bubbling
      (function() {
        var ignorePatterns = [
          'websocket',
          'database is closing',
          'closing/hidden',
          'the database connection is closing',
          'invalidstateerror',
          'could not reach cloud firestore backend'
        ];

        function isIgnored(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          for (var i = 0; i < ignorePatterns.length; i++) {
            if (str.indexOf(ignorePatterns[i]) !== -1) return true;
          }
          return false;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event && (event.message || (event.reason && event.reason.message) || event.reason)) || '';
          if (isIgnored(msg)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message) || event.error)) || '';
          if (isIgnored(msg)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
          }
        }, true);

        var OriginalWebSocket = window.WebSocket;
        if (!OriginalWebSocket) return;

        window.WebSocket = function(url, protocols) {
          var isViteHmr = typeof url === 'string' && (
            url.indexOf('vite') !== -1 || 
            url.indexOf('hmr') !== -1 || 
            url.indexOf('3000') !== -1 || 
            url.indexOf('3005') !== -1
          );
          
          if (isViteHmr) {
            // Return a safe dummy WebSocket-like object that never throws or retries
            return {
              url: url,
              readyState: 0, // CONNECTING (stays connecting so Vite client never retries or fails)
              bufferedAmount: 0,
              extensions: "",
              protocol: "",
              binaryType: "blob",
              send: function() {},
              close: function() {},
              addEventListener: function(type, listener) {
                // Silently accept listeners but do not trigger callbacks to prevent error loops
              },
              removeEventListener: function() {},
              dispatchEvent: function() { return true; },
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null
            };
          }
          
          try {
            return new OriginalWebSocket(url, protocols);
          } catch (e) {
            console.warn('WebSocket connection suppressed:', e);
            return {};
          }
        };
        
        window.WebSocket.prototype = OriginalWebSocket.prototype;
        for (var key in OriginalWebSocket) {
          if (OriginalWebSocket.hasOwnProperty(key)) {
            window.WebSocket[key] = OriginalWebSocket[key];
          }
        }
      })();
    </script>
